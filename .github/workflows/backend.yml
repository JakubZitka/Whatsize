name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "deploy/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "deploy/**", ".github/workflows/backend.yml"]

env:
  IMAGE: ghcr.io/jakubzitka/whatsize-api

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Tests
        working-directory: backend
        run: pytest

  build-push:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    # Rolling deploy: one app server at a time, health-checked between hosts.
    # Requires secrets:
    #   DEPLOY_SSH_KEY  - private key of the "deploy" user (created by cloud-init)
    #   APP_HOSTS       - space-separated public IPs/hostnames, e.g. "1.2.3.4 5.6.7.8"
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Rolling deploy
        run: |
          set -euo pipefail
          for host in ${{ secrets.APP_HOSTS }}; do
            echo "--- deploying to $host"
            ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 "deploy@$host" \
              "cd /srv/whatsize && \
               sed -i 's/^TAG=.*/TAG=${{ github.sha }}/' .env && \
               docker compose -f docker-compose.prod.yml --env-file .env pull api && \
               docker compose -f docker-compose.prod.yml --env-file .env up -d"
            for i in $(seq 1 30); do
              if ssh -i ~/.ssh/id_ed25519 "deploy@$host" \
                   "curl -fsS http://localhost:8000/healthz" > /dev/null 2>&1; then
                echo "$host healthy"; break
              fi
              [ "$i" = 30 ] && { echo "$host failed health check"; exit 1; }
              sleep 2
            done
          done
